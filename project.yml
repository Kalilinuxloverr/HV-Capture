name: HVCapture
options:
  bundleIdPrefix: dev.leonfrohlich
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Ohne Team scheitert die Signierung fürs echte Gerät (im Simulator läuft es
    # auch ohne). Gleiche Team-ID wie die übrigen Projekte hier.
    DEVELOPMENT_TEAM: 7BT7N2JPSQ
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  HVCapture:
    type: application
    platform: iOS
    sources:
      - HVCapture
    dependencies:
      - target: HVCaptureWidgets
        embed: true
      - target: HVCaptureWatch
        embed: true
    info:
      path: HVCapture/Info.plist
      properties:
        CFBundleDisplayName: HV-Capture
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "HV-Capture filmt und fotografiert die Lichtbögen deines Aufbaus."
        NSMicrophoneUsageDescription: "HV-Capture nimmt den Ton der Lichtbögen auf und kann auf das Knallgeräusch hin auslösen."
        NSPhotoLibraryAddUsageDescription: "HV-Capture sichert deine Aufnahmen in der Fotomediathek."
        NSPhotoLibraryUsageDescription: "HV-Capture legt deine Aufnahmen im Album HV-Capture ab und muss es dafür in der Mediathek finden."
        NSLocalNetworkUsageDescription: "HV-Capture spricht die Steckdose direkt im Heimnetz an, um den MOT zu schalten und den Strom zu überwachen."
        NSFaceIDUsageDescription: "HV-Capture kann die App per Face ID sperren, damit niemand versehentlich einschaltet."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonfrohlich.hvcapture
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HVCaptureWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: HVCapture/Model/LiveState.swift
      - path: HVCapture/Design/Palette.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: HV-Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonfrohlich.hvcapture.widgets
        TARGETED_DEVICE_FAMILY: "1"

  HVCaptureWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: HV-Capture
        CFBundleDevelopmentRegion: de
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.leonfrohlich.hvcapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonfrohlich.hvcapture.watchkitapp
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HVCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HVCapture
